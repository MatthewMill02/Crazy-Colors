name: "Godot Auto Release (Windows)"

on:
  push:
    tags:
      - "v*"

env:
  EXPORT_NAME: "crazy-colors"

jobs:
  export_windows:
    name: "Export & Release Windows"
    runs-on: ubuntu-latest
    container:
      # Oficjalny obraz CI z preinstalowanym Godotem 4.3 i szablonami eksportu
      image: barichello/godot-ci:4.3
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Export Directory
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ 2>/dev/null || true
          mkdir -v -p build/windows

      - name: Export Windows Build
        run: |
          godot -v --headless --export-release "Windows Desktop" build/windows/${{ env.EXPORT_NAME }}.exe
          cd build/windows && zip -r ../../${{ env.EXPORT_NAME }}-windows.zip . && cd ../..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            ${{ env.EXPORT_NAME }}-windows.zip